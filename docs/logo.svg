<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="256" y2="256" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#05080E" />
      <stop offset="60%" stop-color="#000000" />
      <stop offset="100%" stop-color="#02050A" />
    </linearGradient>
    <radialGradient id="coreGlow" cx="128" cy="136" r="96" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10F5A0" stop-opacity="0.28" />
      <stop offset="55%" stop-color="#00F0FF" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gaugeArc" x1="36" y1="180" x2="220" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10F5A0" />
      <stop offset="50%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#10F5A0" />
    </linearGradient>
    <linearGradient id="needleGrad" x1="128" y1="150" x2="178" y2="72" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Pitch Black Obsidian Squircle Container -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#bgGrad)" stroke="#10F5A0" stroke-opacity="0.55" stroke-width="3" />
  <rect x="14" y="14" width="228" height="228" rx="48" stroke="#00F0FF" stroke-opacity="0.16" stroke-width="1.5" />
  <circle cx="128" cy="136" r="96" fill="url(#coreGlow)" />

  <!-- Subtle High-Tech Radar Rings -->
  <circle cx="128" cy="144" r="84" stroke="#00F0FF" stroke-opacity="0.15" stroke-width="1.5" stroke-dasharray="4 6" />
  <circle cx="128" cy="144" r="56" stroke="#10F5A0" stroke-opacity="0.22" stroke-width="1.5" />

  <!-- Background Track Arc -->
  <path d="M 48 180 A 88 88 0 1 1 208 180" stroke="#081018" stroke-width="18" stroke-linecap="round" />

  <!-- 3-Tier Neon Gauge Arc (Emerald Green -> Electric Cyan) -->
  <path d="M 48 180 A 88 88 0 1 1 208 180" stroke="url(#gaugeArc)" stroke-width="18" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Tier Tick Marks -->
  <line x1="40" y1="144" x2="52" y2="144" stroke="#10F5A0" stroke-width="3" stroke-linecap="round" />
  <line x1="66" y1="82" x2="75" y2="91" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <line x1="128" y1="56" x2="128" y2="68" stroke="#10F5A0" stroke-width="3.5" stroke-linecap="round" />
  <line x1="190" y1="82" x2="181" y2="91" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" />
  <line x1="216" y1="144" x2="204" y2="144" stroke="#10F5A0" stroke-width="3" stroke-linecap="round" />

  <!-- Tier Micro-Nodes (Fast, Balanced, Deep) -->
  <circle cx="54" cy="112" r="5" fill="#10F5A0" />
  <circle cx="128" cy="56" r="5.5" fill="#00F0FF" />
  <circle cx="202" cy="112" r="5" fill="#10F5A0" />

  <!-- Precision Routing Needle pointing to Optimal Tier -->
  <path d="M 122 146 L 174 74 L 134 152 Z" fill="url(#needleGrad)" filter="url(#neonGlow)" />
  <circle cx="174" cy="74" r="5" fill="#00F0FF" />

  <!-- Center Pivot Hub with Lightning Bolt -->
  <circle cx="128" cy="148" r="26" fill="#000000" stroke="#10F5A0" stroke-opacity="0.8" stroke-width="3" />
  <path d="M 131 131 L 118 149 H 128 L 125 165 L 139 146 H 129 L 131 131 Z" fill="#10F5A0" />

  <!-- Bottom Pill Badge: FAST (Green) · BALANCED (Cyan) · DEEP (White) -->
  <rect x="48" y="196" width="160" height="28" rx="14" fill="#000000" stroke="#10F5A0" stroke-opacity="0.5" stroke-width="1.5" />
  <circle cx="68" cy="210" r="4.5" fill="#10F5A0" />
  <text x="78" y="214" fill="#10F5A0" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">FAST</text>
  <circle cx="118" cy="210" r="4.5" fill="#00F0FF" />
  <text x="128" y="214" fill="#00F0FF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">MED</text>
  <circle cx="168" cy="210" r="4.5" fill="#FFFFFF" />
  <text x="178" y="214" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="800" letter-spacing="1.2">DEEP</text>
</svg>
